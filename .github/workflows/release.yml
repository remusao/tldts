name: Release

on:
  push:
    branches: ['master']

jobs:
  release:
    name: Trigger release
    runs-on: ubuntu-latest
    # Serialize releases (defence in depth for the push below). `queue: max`:
    # never cancel a pending run, as GitHub may keep a stale one over the newest.
    concurrency:
      group: release
      queue: max
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + all tags: `auto shipit` needs them to compute the
          # version bump and changelog. fetch-depth: 0 yields a non-shallow
          # clone, which avoids the "shallow file has changed" fetch race.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use node
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version-file: '.tool-versions'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Bundle
        run: yarn bundle

      - name: Lint
        run: yarn lint

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          # Root `postpack` pushes the version commit + tag once all packages
          # are packed, before any is published: a rejected push publishes nothing.
          PUSH_BEFORE_PUBLISH: 'true'
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          yarn release

      # npm has no multi-package transaction: if publishing failed after this
      # run pushed its release commit, publish the missing packages once more,
      # from exactly that commit (so the bytes match the tag).
      - name: Retry missing packages
        if: failure() && steps.release.outcome == 'failure'
        env:
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
        run: |
          test "$(git rev-parse HEAD)" != "$GITHUB_SHA"
          test "$(git tag --points-at HEAD)" = "v$(node -p "require('./lerna.json').version")"
          git fetch --quiet origin master
          git merge-base --is-ancestor HEAD origin/master
          # A failed publish leaves lerna's `gitHead` in package.json files only.
          if git diff --name-only | grep -qv 'package\.json$'; then exit 1; fi
          git checkout -- .
          : > "$NPM_CONFIG_USERCONFIG"
          yarn lerna publish from-package --yes
