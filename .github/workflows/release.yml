name: Release

on:
  push:
    branches: ['master']

jobs:
  release:
    name: Trigger release
    runs-on: ubuntu-latest
    # Serialize releases (defence in depth for the push below). `queue: max`:
    # never cancel a pending run, as GitHub may keep a stale one over the newest.
    concurrency:
      group: release
      queue: max
    if: "!contains(github.event.head_commit.message, 'ci skip') && !contains(github.event.head_commit.message, 'skip ci')"
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + all tags: `auto shipit` needs them to compute the
          # version bump and changelog. fetch-depth: 0 yields a non-shallow
          # clone, which avoids the "shallow file has changed" fetch race.
          fetch-depth: 0

      - name: Enable Corepack
        run: corepack enable

      - name: Use node
        uses: actions/setup-node@v7
        with:
          cache: yarn
          node-version-file: '.tool-versions'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build
        run: yarn build

      - name: Bundle
        run: yarn bundle

      - name: Lint
        run: yarn lint

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/npmrc
          # Root `postpack` pushes the version commit + tag once all packages
          # are packed, before any is published: a rejected push publishes nothing.
          PUSH_BEFORE_PUBLISH: 'true'
        run: |
          : > "$NPM_CONFIG_USERCONFIG"
          yarn release
